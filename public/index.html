<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>เว็บสเต็กง่ายๆ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>เว็บสเต็ก ง่าย ๆ</h1>
      <p>โพสต์ข้อความของคุณแล้วจะเห็นทันทีในฟีด</p>
    </header>

    <section class="post-form">
      <form id="postForm" enctype="multipart/form-data">
        <input type="text" name="acount" placeholder="ผู้โพสต์" class="poster" /><br />
        <textarea name="text" placeholder="เขียนอะไรสักอย่าง..." required></textarea><br />
        สีตัวอักษร:
        <select name="color">
          <option value="black">ดำ</option>
          <option value="red">แดง</option>
          <option value="green">เขียว</option>
          <option value="blue">ฟ้า</option>
        </select><br />
        แนบรูปภาพ: <input type="file" name="image" /><br />
        <button type="submit">โพสต์</button>
      </form>
    </section>

    <section class="feed">
      <h2>ฟีด</h2>
      <div id="postsContainer">
        <p class="empty">กำลังโหลดโพสต์...</p>
      </div>
    </section>
  </div>

  <script>
    async function loadPosts() {
      const container = document.getElementById('postsContainer');
      container.innerHTML = '<p class="empty">กำลังโหลดโพสต์...</p>';

      try {
        const res = await fetch('/posts');
        const posts = await res.json();

        if (!posts.length) {
          container.innerHTML = '<p class="empty">ยังไม่มีโพสต์</p>';
          return;
        }

        container.innerHTML = renderPosts(posts);
      } catch (err) {
        container.innerHTML = '<p class="empty">โหลดโพสต์ไม่สำเร็จ</p>';
        console.error('โหลดโพสต์ไม่สำเร็จ:', err);
      }
    }

    function renderPosts(posts) {
      return posts.map(post => `
        <div class="post" style="border:1px solid #ddd; padding:10px; margin:10px 0;">
          <strong style="color:${post.color}">${escapeHtml(post.name)}</strong>
          <p>${nl2br(escapeHtml(post.text))}</p>
          ${post.image ? `<img src="${post.image}" alt="post image" style="max-width:300px;" />` : ''}
          <br><small>โพสต์เมื่อ : ${post.created_at}</small>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function nl2br(str) {
      return str.replace(/\n/g, "<br>");
    }

    document.getElementById('postForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      try {
        const res = await fetch('/post', {
          method: 'POST',
          body: formData
        });
        if (res.ok) {
          this.reset();
          // โหลดโพสต์ใหม่ทั้งหมด
          loadPosts();
        } else {
          alert('เกิดข้อผิดพลาดขณะโพสต์');
        }
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
        console.error(err);
      }
    });

    document.addEventListener('DOMContentLoaded', loadPosts);
  </script>
</body>
</html>
